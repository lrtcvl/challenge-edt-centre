<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats en Direct</title>
    <link rel="icon" href="logo.png">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="common.css">
    <style>
        :root {
            --header-offset: 118px;
            --discipline-offset: 186px;
        }

        header.top {
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .discipline-section {
            background: #fff;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 30px;
            border: 1px solid #edf2f7;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .03);
        }

        .discipline-title {
            color: #042247;
            background: #b0c7e2;
            border-left: 6px solid var(--primary);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            position: sticky;
            top: var(--header-offset);
            z-index: 90;
            box-shadow: 0 10px 10px -10px rgba(0, 0, 0, .1);
        }

        .category-title {
            background: #f3e6f0;
            color: #6d1f4e;
            padding: 7px 14px;
            border-radius: 10px;
            font-weight: 700;
            width: fit-content;
            border-left: 4px solid #9b3272;
            margin-bottom: 10px;
            position: sticky;
            top: var(--discipline-offset);
            z-index: 80;
            box-shadow: 0 4px 6px -2px rgba(0, 0, 0, .05);
        }

        .rank-cell {
            font-weight: 800;
            width: 44px;
            text-align: center;
            color: var(--text-light);
        }

        .name-cell {
            font-weight: 700;
        }

        .score-cell {
            text-align: right;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
        }

        .series-badge {
            display: inline-block;
            padding: 2px 6px;
            background: #e2e8f0;
            margin: 0 2px;
            border-radius: 4px;
            font-size: .85rem;
            font-weight: 600;
        }

        .table-scroll {
            overflow-x: auto;
        }

        .info-btn {
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
        }

        .speed-slider {
            width: 100%;
        }

        /* ---------- Boutons flottants (impression + réglages) ---------- */
        .fab-group {
            position: fixed;
            bottom: 22px;
            right: 22px;
            display: flex;
            gap: 10px;
        }

        .print-page-header {
            display: none;
        }

        /* ---------- Impression : 1 épreuve = 1 page A4, contenu ajusté ----------
           Les règles visuelles sont portées par body.print-mode (activé par
           enterPrintMode() juste avant l'impression) afin que la taille du
           contenu puisse être mesurée à l'écran avec exactement la même mise
           en page que sur le papier. */
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        body.print-mode {
            background: #fff;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body.print-mode .container {
            width: 189mm;
            max-width: none;
            margin: 0;
        }

        body.print-mode header.top,
        body.print-mode .no-print {
            display: none !important;
        }

        body.print-mode .discipline-section {
            --pfs: 14px;
            font-size: var(--pfs);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            break-inside: avoid;
            page-break-inside: avoid;
            break-after: page;
            page-break-after: always;
        }

        body.print-mode .discipline-section:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        body.print-mode .print-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6em;
            background: var(--primary);
            color: #fff;
            border-radius: 1em;
            padding: .8em 1.4em;
            margin-bottom: 1.2em;
        }

        body.print-mode .print-page-header img {
            height: 4em;
        }

        body.print-mode .print-page-header .pph-text {
            flex: 1;
            text-align: center;
        }

        body.print-mode .print-page-header .pph-title {
            font-size: 1.6em;
            font-weight: 800;
        }

        body.print-mode .print-page-header .pph-sub {
            font-size: .85em;
            opacity: .9;
        }

        body.print-mode .discipline-title {
            position: static;
            font-size: 1.4em;
            padding: .5em .7em;
            margin: 0 0 .8em 0;
            box-shadow: none;
        }

        body.print-mode .category-block {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        body.print-mode .category-title {
            position: static;
            font-size: 1em;
            padding: .35em .8em;
            margin-bottom: .5em;
            box-shadow: none;
        }

        body.print-mode .table-scroll {
            overflow: visible;
            margin-bottom: .6em;
        }

        body.print-mode table {
            font-size: 1em;
        }

        body.print-mode th {
            font-size: .8em;
            padding: .4em .6em;
        }

        body.print-mode td {
            font-size: .95em;
            padding: .45em .6em;
        }

        body.print-mode .rank-cell {
            width: 3em;
        }

        body.print-mode .score-cell {
            font-size: 1.15em;
        }

        body.print-mode .series-badge {
            font-size: .85em;
            padding: .1em .4em;
            margin: 0 .15em;
        }

        body.print-mode .no-data {
            padding: 1em;
        }

        @media (max-width:900px) {
            :root {
                --header-offset: 100px;
                --discipline-offset: 158px;
            }
        }

        @media (max-width:600px) {
            :root {
                --header-offset: 84px;
                --discipline-offset: 132px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="top">
            <img src="logo.png" alt="Logo" style="height:65px;">
            <div style="text-align:center; flex:1;">
                <h1 id="compTitle">Chargement...</h1>
                <div class="sub" id="etapeLocation" style="font-weight:700;"></div>
                <div class="sub" id="challengeSub"></div>
            </div>
            <img src="logo.png" alt="" style="height:65px; visibility:hidden;">
        </header>

        <div id="resultsContainer">
            <div class="no-data">Chargement des résultats...</div>
        </div>
    </div>

    <div class="fab-group no-print">
        <button class="info-btn" title="Imprimer le palmarès" aria-label="Imprimer le palmarès"
            onclick="printResults()">🖨️</button>
        <button class="info-btn" title="Réglages" aria-label="Réglages"
            onclick="document.getElementById('infoModal').classList.add('active')">ⓘ</button>
    </div>
    <div class="modal-overlay no-print" id="infoModal">
        <div class="modal-content">
            <h3>Réglages</h3>
            <p>Vitesse de défilement automatique :</p>
            <input type="range" min="0" max="80" value="40" class="speed-slider" id="speedSlider"
                oninput="setSpeed(this.value)">
            <p style="font-size:.8rem; color:var(--text-light);">0 = défilement désactivé</p>
            <button class="btn secondary"
                onclick="document.getElementById('infoModal').classList.remove('active')">Fermer</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="ranking.js"></script>
    <script>
        // Constantes liées à l'impression (déclarées en premier : utilisées par le rendu)
        const PRINT_HEADER_PLACEHOLDER = '<div class="print-page-header"></div>';
        const PRINT_PAGE_HEIGHT_PX = 270 * 96 / 25.4; // zone utile A4 (297mm - marges) avec petite réserve
        let savedScrollY = 0;

        const urlParams = new URLSearchParams(location.search);
        const seasonKey = urlParams.get('season');
        const etapeKey = urlParams.get('etape');
        document.getElementById('challengeSub').textContent = CONFIG.challengeName;

        let scrollSpeed = 90 - (parseInt(urlParams.get('speed')) || 40) * 1; // ms entre chaque pas de scroll (plus petit = plus rapide)
        function setSpeed(v) { scrollSpeed = 90 - parseInt(v); restartAutoScroll(); }

        if (!seasonKey || !etapeKey) {
            document.getElementById('resultsContainer').innerHTML = '<div class="no-data" style="color:#c0392b;">⚠️ Paramètres manquants (season / etape).</div>';
        } else {
            const etapeRef = db.ref(`${ROOT}/${seasonKey}/etapes/${etapeKey}`);

            etapeRef.child('config').on('value', snap => {
                const cfg = snap.val() || {};
                document.getElementById('compTitle').textContent = cfg.name || etapeKey;
                const locParts = [cfg.department ? `Dépt. ${cfg.department}` : '', cfg.location || ''].filter(Boolean);
                document.getElementById('etapeLocation').textContent = locParts.join(' — ');
                if (cfg.scrollSpeed !== undefined && !urlParams.has('speed')) {
                    document.getElementById('speedSlider').value = cfg.scrollSpeed;
                    scrollSpeed = 90 - cfg.scrollSpeed;
                }
                requestAnimationFrame(updateStickyOffsets);
            });

            etapeRef.child('shooters').on('value', snap => {
                const data = snap.val() || {};
                const all = Object.keys(data).map(k => data[k]);
                if (all.length === 0) {
                    document.getElementById('resultsContainer').innerHTML = '<div class="no-data">Aucun tireur enregistré pour le moment.</div>';
                    return;
                }
                renderResults(all);
            });
        }

        function updateStickyOffsets() {
            const header = document.querySelector('header.top');
            const firstDiscTitle = document.querySelector('.discipline-title');
            if (header) {
                const headerOffset = header.getBoundingClientRect().height + 20; // +marge top sticky du header
                document.documentElement.style.setProperty('--header-offset', headerOffset + 'px');
                if (firstDiscTitle) {
                    const discOffset = headerOffset + firstDiscTitle.getBoundingClientRect().height + 10;
                    document.documentElement.style.setProperty('--discipline-offset', discOffset + 'px');
                }
            }
        }
        window.addEventListener('resize', () => requestAnimationFrame(updateStickyOffsets));

        function renderResults(all) {
            const shootersByDiscipline = {};
            DISCIPLINES.forEach(d => shootersByDiscipline[d.key] = all.filter(s => s.discipline === d.key));

            let html = '';
            DISCIPLINES.forEach(disc => {
                html += `<div class="discipline-section">${PRINT_HEADER_PLACEHOLDER}<h2 class="discipline-title">${disc.label}</h2>`;
                html += renderCategoryTables(shootersByDiscipline[disc.key]);
                html += `</div>`;
            });

            // Combiné (calculé automatiquement)
            const combineList = computeCombineForEtape(shootersByDiscipline);
            if (combineList.length > 0) {
                html += `<div class="discipline-section">${PRINT_HEADER_PLACEHOLDER}<h2 class="discipline-title">${COMBINE.label}</h2>`;
                html += renderCategoryTables(combineList, true);
                html += `</div>`;
            }

            document.getElementById('resultsContainer').innerHTML = html;
            requestAnimationFrame(updateStickyOffsets);
        }

        function renderCategoryTables(list, isCombine) {
            const tree = groupByCategory(list);
            const cats = Object.keys(tree).sort();
            if (cats.length === 0) return '<div class="no-data">Aucun résultat pour le moment.</div>';
            let html = '';
            cats.forEach(cat => {
                const ranked = assignRanks(sortShooters(tree[cat]));
                html += `<div class="category-block"><div class="category-title">${categoryLabel(cat)}</div>
      <div class="table-scroll"><table><thead><tr>
        <th style="width:50px;">Pl.</th><th>Nom Prénom</th><th>Club</th>
        ${isCombine ? '<th style="text-align:right;">Pistolet</th><th style="text-align:right;">Carabine</th>' : '<th style="text-align:center;">Séries</th>'}
        <th style="text-align:right;">Total</th></tr></thead><tbody>`;
                ranked.forEach(s => {
                    const status = s.status || 'OK';
                    const hr = hasResult(status);
                    const medal = (s.displayRank === 1) ? '🥇 ' : (s.displayRank === 2) ? '🥈 ' : (s.displayRank === 3) ? '🥉 ' : '';
                    const displayScore = hr ? (s.score !== undefined ? Math.round(s.score * 10) / 10 : 0) : '-';
                    const mouchesSuffix = (s.mouches > 0 && hr) ? ` <small style="color:var(--text-light);">/${s.mouches}x</small>` : '';
                    let seriesOrCombineCells;
                    if (isCombine) {
                        seriesOrCombineCells = `<td style="text-align:right;">${hr ? s.pistoletScore : '-'}</td><td style="text-align:right;">${hr ? s.carabineScore : '-'}</td>`;
                    } else {
                        const series = hr ? (s.series || []) : [];
                        seriesOrCombineCells = `<td style="text-align:center;">${series.map(v => `<span class="series-badge">${Math.round(v * 10) / 10}</span>`).join('')}</td>`;
                    }
                    html += `<tr>
        <td class="rank-cell">${s.displayRank}</td>
        <td class="name-cell">${medal}${s.lastName} ${s.firstName}</td>
        <td>${s.club || '-'}</td>
        ${seriesOrCombineCells}
        <td class="score-cell">${displayScore}${mouchesSuffix}</td>
      </tr>`;
                });
                html += `</tbody></table></div></div>`;
            });
            return html;
        }

        // ─── Impression du palmarès : 1 épreuve par page A4, ajustée à la page ───
        function printHeaderHTML() {
            const title = document.getElementById('compTitle').textContent;
            const loc = document.getElementById('etapeLocation').textContent;
            const sub = document.getElementById('challengeSub').textContent;
            return `<img src="logo.png" alt="Logo">
                <div class="pph-text"><div class="pph-title">${title}</div>
                ${loc ? `<div class="pph-sub" style="font-weight:700;">${loc}</div>` : ''}
                <div class="pph-sub">${sub}</div></div>
                <img src="logo.png" alt="" style="visibility:hidden;">`;
        }

        // Réduit la taille de police de chaque épreuve jusqu'à ce qu'elle tienne sur une page.
        function fitSectionsToPage() {
            document.querySelectorAll('.discipline-section').forEach(sec => {
                let lo = 4, hi = 14; // px
                sec.style.setProperty('--pfs', hi + 'px');
                if (sec.getBoundingClientRect().height <= PRINT_PAGE_HEIGHT_PX) return;
                for (let i = 0; i < 12; i++) {
                    const mid = (lo + hi) / 2;
                    sec.style.setProperty('--pfs', mid + 'px');
                    if (sec.getBoundingClientRect().height <= PRINT_PAGE_HEIGHT_PX) lo = mid; else hi = mid;
                }
                sec.style.setProperty('--pfs', lo + 'px');
            });
        }

        function enterPrintMode() {
            if (document.body.classList.contains('print-mode')) return;
            savedScrollY = window.scrollY;
            const headerHtml = printHeaderHTML();
            document.querySelectorAll('.print-page-header').forEach(h => { h.innerHTML = headerHtml; });
            document.body.classList.add('print-mode');
            fitSectionsToPage();
        }

        function exitPrintMode() {
            document.body.classList.remove('print-mode');
            document.querySelectorAll('.discipline-section').forEach(sec => sec.style.removeProperty('--pfs'));
            window.scrollTo(0, savedScrollY);
            requestAnimationFrame(updateStickyOffsets);
        }

        function printResults() {
            enterPrintMode();
            window.print();
        }

        // Couvre aussi Ctrl+P / menu du navigateur.
        window.addEventListener('beforeprint', enterPrintMode);
        window.addEventListener('afterprint', exitPrintMode);

        let scrollIntervalId;
        let isScrolling = true;
        function startAutoScroll() {
            scrollIntervalId = setInterval(() => {
                if (scrollSpeed <= 5) return; // vitesse ~0 = pas de défilement
                if (isScrolling) {
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                        isScrolling = false;
                        setTimeout(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => { isScrolling = true; }, 2000); }, 3000);
                    } else { window.scrollBy(0, 1); }
                }
            }, scrollSpeed);
        }
        function restartAutoScroll() { if (scrollIntervalId) clearInterval(scrollIntervalId); startAutoScroll(); }
        setTimeout(startAutoScroll, 4000);
    </script>
</body>

</html>
